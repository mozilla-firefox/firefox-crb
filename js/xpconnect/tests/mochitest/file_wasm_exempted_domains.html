<!DOCTYPE html>
<script src="file_wasm_exempted_domains_probe.js"></script>
<script>
"use strict";

let worker;

function fromWorker() {
  return new Promise((resolve, reject) => {
    worker.onmessage = e => resolve(e.data);
    worker.onerror = e => {
      e.preventDefault();
      worker.terminate();
      reject(new Error(`worker: ${e.message}`));
    };
  });
}

async function fromWorklet() {
  const ctx = new OfflineAudioContext(1, 128, 44100);
  await ctx.audioWorklet.addModule("file_wasm_exempted_domains_worklet.js");
  const node = new AudioWorkletNode(ctx, "wasm-probe");
  const result = new Promise((resolve, reject) => {
    node.port.onmessage = e => resolve(e.data);
    node.onprocessorerror = () => reject(new Error("worklet processor error"));
  });
  node.connect(ctx.destination);
  await ctx.startRendering();
  return result;
}

async function probeAll() {
  if (location.search === "?window") {
    return { window: wasmProbe() };
  }
  worker = new Worker("file_wasm_exempted_domains_worker.js");
  const workers = await fromWorker();
  return { window: wasmProbe(), ...workers, worklet: await fromWorklet() };
}

async function report(fn) {
  let result;
  try {
    result = await fn();
  } catch (e) {
    result = { error: String(e) };
  }
  parent.postMessage(result, "*");
}

window.onmessage = e => {
  if (e.source === parent) {
    worker.postMessage("respawn");
    report(fromWorker);
  }
};

report(probeAll);
</script>
