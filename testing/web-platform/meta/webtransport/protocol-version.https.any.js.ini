[protocol-version.https.any.html]
  # Firefox's HTTP/3 client always negotiates draft-07 (":protocol: webtransport"),
  # so it cannot connect to a server that only accepts the draft-15 value
  # ("webtransport-h3"). See bug 2033974.
  [Connect to draft-15-only server (webtransport-h3 protocol)]
    expected: FAIL

  [Data transfer works on draft-15-only server]
    expected: FAIL

[protocol-version.https.any.worker.html]
  [Connect to draft-15-only server (webtransport-h3 protocol)]
    expected: FAIL

  [Data transfer works on draft-15-only server]
    expected: FAIL
