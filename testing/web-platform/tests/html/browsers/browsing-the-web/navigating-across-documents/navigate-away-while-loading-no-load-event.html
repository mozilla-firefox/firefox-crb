<!DOCTYPE html>
<meta charset="utf-8">
<meta name="timeout" content="long">
<title>A document that is still loading when a navigation starts never fires its load event</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/browsing-the-web.html#navigate">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/common/utils.js"></script>
<script src="resources/pending-navigation-helpers.js"></script>
<script>
promise_test(async t => {
  const parserRequest = heldRequest(t, "script");
  const win = await openObserver(t, parserRequest);

  const originalDocument = win.document;
  win.scriptExecuted = false;
  const events = [];
  const loaded = new Promise(resolve => {
    win.addEventListener("load", () => {
      events.push("load");
      resolve("load");
    });
  });
  win.addEventListener("pagehide", () => events.push("pagehide"));

  const parserScriptEvents = [];
  const parserScriptListener = event => {
    if (event.source === win &&
        ["parser-script-load", "parser-script-error"].includes(event.data)) {
      parserScriptEvents.push(event.data);
    }
  };
  window.addEventListener("message", parserScriptListener);
  t.add_cleanup(() => window.removeEventListener("message", parserScriptListener));

  const navigationRequest = heldRequest(t, "navigation");
  win.location.href = navigationRequest.url;
  await navigationRequest.waitForRequest();
  assert_equals(win.document, originalDocument, "The navigation has not committed");
  assert_equals(originalDocument.readyState, "complete",
    "Starting the navigation aborts the document's parser");

  await parserRequest.release();

  const loadEvent = await Promise.race([loaded, timeout(t, 5000, "none")]);

  const scriptExecuted = win.scriptExecuted;
  assert_equals(win.document, originalDocument, "The navigation has not committed");

  const navigated = popupMessage(t, win, ["navigated"]);
  await navigationRequest.release();
  await navigated;
  assert_equals(win.document.body.textContent, "Navigated", "The navigation completes");

  assert_false(scriptExecuted, "The aborted parser does not run the script it was blocked on");
  assert_array_equals(parserScriptEvents, [],
    "The script the aborted parser was blocked on fires neither load nor error");
  assert_equals(loadEvent, "none", "The aborted document does not fire its load event");
  assert_array_equals(events, ["pagehide"],
    "The aborted document is replaced without having fired its load event");
}, "Starting a navigation aborts a loading document's parser and load event before the new document commits");
</script>
