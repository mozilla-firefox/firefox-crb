---
task-defaults:
    description: "Test install-firefox.sh: {name}"
    task-context:
        substitution-fields:
            - description
    run:
        run-as-root: true
        checkout: false
    dependencies:
        source-artifact: source-artifact-linux64
    fetches:
        source-artifact:
            - artifact: install-firefox.sh
              extract: false
    install-script-command: sh $MOZ_FETCHES_DIR/install-firefox.sh
    worker:
        env:
            # Upstream debian and ubuntu images would otherwise prompt, e.g. for tzdata.
            DEBIAN_FRONTEND: noninteractive
    optimization:
        skip-unless-changed:
            - taskcluster/kinds/linux-install-test/integration.yml
            - taskcluster/kinds/source-artifact/kind.yml

# Tasks run directly on upstream docker images, like users' machines do, except
# when they need an in-tree image (e.g. flatpak). Upstream images have no run-task,
# so the linux_install_test transform downloads `fetches` with curl or wget, which
# pre-install must provide.
#
# Expanded by the linux_install_test transform into one
# <distro>-<arch>-<method> task per distro, architecture and install method.
distros:
    architectures:
        x64:
            worker-type: b-linux
            platform: linux64/opt
        a64:
            worker-type: b-linux-aarch64
            platform: linux64-aarch64/opt

    channels: [release, beta, devedition, nightly, esr]
    locales: [en-US, fr, ja]

    # TODO: add snap distro once a suitable CI worker image with snapd is available
    distros:
        debian-12:
            symbol: deb12
            pre-install: &apt-pre-install apt-get update -qq && apt-get install -y -qq curl wget xz-utils gnupg
            docker-image: "debian:bookworm"
            methods: [apt, tarball]

        ubuntu-2004:
            symbol: ub20
            pre-install: apt-get update -qq && apt-get install -y -qq curl wget xz-utils gnupg
            docker-image: "ubuntu:focal"
            methods: [apt, tarball]
            architectures: [x64]

        ubuntu-2204:
            symbol: ub22
            pre-install: apt-get update -qq && apt-get install -y -qq curl wget xz-utils gnupg
            docker-image: "ubuntu:jammy"
            methods: [apt]

        debian-13:
            symbol: deb13
            pre-install: *apt-pre-install
            docker-image: "debian:trixie"
            methods: [apt, tarball]

        fedora-41:
            symbol: f41
            pre-install: dnf install -y curl wget tar xz
            docker-image: "fedora:41"
            methods: [rpm, tarball]

        opensuse-leap:
            symbol: leap
            pre-install: zypper refresh && zypper install -y curl wget tar xz
            docker-image: "opensuse/leap:16.0"
            methods: [rpm, tarball]

        rocky-8:
            symbol: rky8
            pre-install: dnf install -y curl wget tar xz
            docker-image: "rockylinux/rockylinux:8"
            methods: [rpm]

        # Rocky Linux 9 is not tested: dnf cannot import Mozilla's RPM signing key there, because
        # RHEL 9's default crypto policy rejects the SHA-1 signatures in the key (rpm --import exits 1).
        rocky-10:
            symbol: rky10
            pre-install: dnf install -y curl wget tar xz
            docker-image: "rockylinux/rockylinux:10"
            methods: [rpm]

        alma-8:
            symbol: alm8
            pre-install: dnf install -y curl wget tar xz
            docker-image: "almalinux:8"
            methods: [rpm]

        # AlmaLinux 9 is not tested: dnf cannot import Mozilla's RPM signing key there, because
        # RHEL 9's default crypto policy rejects the SHA-1 signatures in the key (rpm --import exits 1).
        alma-10:
            symbol: alm10
            pre-install: dnf install -y curl wget tar xz
            docker-image: "almalinux:10"
            methods: [rpm]

        debian-12-flatpak:
            symbol: deb12-fpk
            pre-install: *apt-pre-install
            docker-image:
                x64: {in-tree: debian12-flatpak}
                a64: {in-tree: debian12-arm64-flatpak}
            methods: [flatpak]
            channels: [release, beta]
            locales: [en-US]  # flatpak ignores locale; en-US avoids redundant tasks
            max-run-time: 1800

debian-12-x64-apt-release-env:
    description: "Test install-firefox.sh: apt release on debian-12 (auto-detect locale from env)"
    worker-type: b-linux
    worker:
        docker-image: "debian:bookworm"
    pre-install: apt-get update -qq && apt-get install -y -qq curl wget xz-utils
    install-method: apt
    lang-env: fr_FR.UTF-8
    channels: [release]
    locales: [en-US]
    treeherder:
        platform: linux64/opt
        symbol: inst-apt(deb12-x64-rel-env)

debian-12-x64-apt-release-wget:
    description: "Test install-firefox.sh: apt release on debian-12 (wget only, no curl)"
    worker-type: b-linux
    worker:
        docker-image: "debian:bookworm"
    pre-install: >-
        apt-get update -qq && apt-get install -y -qq curl wget xz-utils &&
        apt-get remove -y curl
    install-method: apt
    channels: [release]
    locales: [en-US]
    treeherder:
        platform: linux64/opt
        symbol: inst-apt(deb12-x64-rel-wget)

ubuntu-2004-x64-apt-release-upgrade:
    description: "Test install-firefox.sh: apt release over pre-installed distro firefox"
    worker-type: b-linux
    worker:
        docker-image: "ubuntu:focal"
    pre-install: apt-get update -qq && apt-get install -y -qq curl wget xz-utils gnupg firefox
    install-method: apt
    channels: [release]
    locales: [en-US]
    treeherder:
        platform: linux64/opt
        symbol: inst-apt(ub20-x64-rel-upg)

