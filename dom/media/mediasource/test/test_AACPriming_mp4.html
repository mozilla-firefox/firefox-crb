<!DOCTYPE HTML>
<html>
<head>
  <title>MSE: the AAC priming signalled by an MP4 edit list isn't played</title>
  <script src="/tests/SimpleTest/SimpleTest.js"></script>
  <script type="text/javascript" src="mediasource.js"></script>
  <script type="text/javascript" src="audio_timeline.js"></script>
  <link rel="stylesheet" type="text/css" href="/tests/SimpleTest/test.css" />
</head>
<body>
<pre id="test">
<script class="testbody" type="text/javascript">

// The files in aac-priming/ hold 24576 frames of silence at 48 kHz with a
// single sample click. flac_click_48k.mp4 has its click at frame 21600 and no
// codec delay. The AAC files begin with 1024 frames of encoder priming, which
// their edit list excludes from the presentation, as in each ad of a stream
// with server-side ad insertion.
//
// The FLAC clip is appended at 0, and each AAC clip after it with its init
// segment. In "segments" mode, a timestampOffset places each AAC clip right
// after the previous clip. In "sequence" mode, each clip follows the previous
// one from the start of the frames its edit list skips, which precede the
// start of its presentation.
const kFLAC = {
  file: "aac-priming/flac_click_48k.mp4",
  type: 'audio/mp4; codecs="flac"',
  frames: 24576,
  click: 21600,
};
const kAACType = 'audio/mp4; codecs="mp4a.40.2"';
// `skip` is the number of frames the edit list skips, and `frames` the number
// of frames in the presentation.
const kAAC = {
  file: "aac-priming/aac_priming_click.mp4",
  skip: 1024,
  frames: 24576,
  click: 2400,
};
// The click is in the first frame after the priming.
const kAACStart = {
  file: "aac-priming/aac_priming_click_start_96k.mp4",
  skip: 1024,
  frames: 24576,
  click: 500,
};
// The click is in the last frame.
const kAACEnd = {
  file: "aac-priming/aac_priming_click_end.mp4",
  skip: 1024,
  frames: 24576,
  click: 24000,
};
// The edit list skips 1088 frames after the priming, which straddle a frame.
const kAAC2112 = {
  file: "aac-priming/aac_priming_2112_click.mp4",
  skip: 2112,
  frames: 24576 - 1088,
  click: 2400 - 1088,
};

const kCases = [
  { name: "AAC after FLAC", clips: [kAAC] },
  { name: "AAC click in the first frame", clips: [kAACStart] },
  {
    name: "AAC clips with the same init segment",
    clips: [kAAC, kAAC, kAAC],
  },
  {
    name: "AAC clips with differing init segments",
    clips: [kAAC, kAACStart, kAAC, kAACStart],
  },
  { name: "AAC click in the last frame", clips: [kAACEnd] },
  // The priming of the following clip overlaps the last frame of the previous
  // clip. The coded frame processing doesn't remove that frame, as the decode
  // timestamps of the two clips are continuous.
  {
    name: "AAC click in the last frame of a clip followed by another",
    clips: [kAACEnd, kAAC],
  },
  {
    name: "AAC clips skipping more than the priming",
    clips: [kAAC2112, kAAC2112],
  },
  // appendWindowStart trims the first frame after the priming as well.
  {
    name: "AAC clip after appendWindowStart",
    clips: [{ ...kAACStart, appendWindowStart: 300 }],
  },
  {
    name: "AAC clips in sequence mode",
    mode: "sequence",
    clips: [kAAC, kAACStart, kAAC2112, kAAC],
  },
];

// Returns the clips of a case, each with the frame of the timeline where its
// presentation starts, and its appendWindowStart on the timeline.
function placeClips(aMode, aClips) {
  const placed = [{ ...kFLAC, start: 0 }];
  let end = kFLAC.frames;
  for (const clip of aClips) {
    const start = aMode == "sequence" ? end + clip.skip : end;
    placed.push({
      ...clip,
      type: kAACType,
      start,
      appendWindowStart:
        clip.appendWindowStart === undefined
          ? undefined
          : start + clip.appendWindowStart,
    });
    end = start + clip.frames;
  }
  return placed;
}

// The edit list of kAAC2112 skips the first 64 frames of its third frame.
// Appends it at 1 s with appendWindowEnd at aEnd frames after 1 s, and returns
// the buffered ranges and the number of frames in the track buffer.
async function appendWithAppendWindowEnd(aFiles, aEnd) {
  const ms = new MediaSource();
  const el = document.createElement("audio");
  el.src = URL.createObjectURL(ms);
  await once(ms, "sourceopen");
  const sb = ms.addSourceBuffer(kAACType);
  sb.timestampOffset = 1;
  sb.appendWindowEnd = 1 + aEnd / kRate;
  await loadSegment(sb, aFiles[kAAC2112.file]);
  const buffered = sb.buffered;
  const info = await SpecialPowers.wrap(ms).mozDebugReaderData();
  el.removeAttribute("src");
  el.load();
  return { buffered, frames: info.demuxer.audioTrack.numSamples };
}

SimpleTest.waitForExplicitFinish();
SimpleTest.requestFlakyTimeout("Waits for the AudioSink to stop writing");

runWithMSE(async () => {
  const files = await fetchClips(
    [kFLAC, kAAC, kAACStart, kAACEnd, kAAC2112].map(c => c.file)
  );
  for (const end of [-32, 0]) {
    const { buffered, frames } = await appendWithAppendWindowEnd(files, end);
    is(buffered.length, 0, `appendWindowEnd ${end}: nothing is buffered`);
    is(frames, 0, `appendWindowEnd ${end}: no frame is kept`);
  }
  const { buffered, frames } = await appendWithAppendWindowEnd(files, 32);
  is(buffered.length, 1, "appendWindowEnd 32: one range is buffered");
  isfuzzy(buffered.start(0), 1, 1 / kRate, "appendWindowEnd 32: from 1 s");
  is(frames, 2, "appendWindowEnd 32: the frame and its preroll are kept");
  for (const c of kCases) {
    const mode = c.mode ?? "segments";
    const clips = placeClips(mode, c.clips);
    const last = clips[clips.length - 1];
    // The AudioSink must write as many frames as the timeline holds, or the
    // audio clock drifts from the timeline. timestampOffset is kept to the
    // microsecond, which can move a clip by a frame.
    isfuzzy(
      await measureWrittenFrames(files, mode, clips),
      last.start + last.frames,
      1,
      `${c.name}: the AudioSink writes the frames of the timeline`
    );
    await checkClicks(
      c.name,
      files,
      mode,
      clips,
      clips.slice(1).map(clip => clip.start + clip.click - kFLAC.click)
    );
  }
  SimpleTest.finish();
});

</script>
</pre>
</body>
</html>
