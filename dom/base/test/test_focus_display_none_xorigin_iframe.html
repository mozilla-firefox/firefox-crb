<!DOCTYPE html>
<html>
<!--
https://bugzilla.mozilla.org/show_bug.cgi?id=1716762
-->
<head>
<meta charset="utf-8">
<title>Test for Bug 1716762</title>
<script src="/tests/SimpleTest/SimpleTest.js"></script>
<link rel="stylesheet" type="text/css" href="/tests/SimpleTest/test.css"/>
</head>
<body>
<a target="_blank" href="https://bugzilla.mozilla.org/show_bug.cgi?id=1716762">Mozilla Bug 1716762</a><br>
<input></input><br>
<div id="target" style="display: none;">
<iframe src="http://example.org/tests/dom/base/test/file_focus_display_none_xorigin_iframe_inner.html"></iframe>
</div>
<div id="objectcontainer"></div>
<div id="nested" style="display: none;">
<iframe src="http://example.org/tests/dom/base/test/file_focus_display_none_xorigin_iframe_middle.html"></iframe>
</div>
<script type="text/javascript">

let waitForMessage = function(aMsg) {
  return new Promise(reslove => {
    window.addEventListener("message", function handler(e) {
      info(`main received message: ${e.data}`);
      if (e.data === aMsg) {
        window.removeEventListener("message", handler);
        reslove();
      }
    });
  });
};

let sendMessage = async function(aWindow, aMsg) {
  aWindow.postMessage(aMsg, "*");
  await waitForMessage("done");
}

let getFocus = function(aWindow) {
  return new Promise(reslove => {
    window.addEventListener("message", function handler(e) {
      info(e.data);
      reslove(e.data);
    }, { once: true });
    aWindow.postMessage("getfocus", "*");
  });
}

/** Test for Bug 1716762  */

let input = document.querySelector("input");
let iframe = document.querySelector("iframe");

add_task(async function test_ancestor_display_none_window_focus() {
  input.focus();
  is(document.activeElement.tagName, "INPUT", "focus should move to input element");

  // Like in other browsers, the document of a hidden iframe can be focused,
  // though its elements can't.
  await sendMessage(iframe.contentWindow, "focuswindow");
  is(document.activeElement.tagName, "IFRAME", "focus should move to iframe element");
  ok(await getFocus(iframe.contentWindow), "iframe document should have focus");

  // The focus fixup runs in the rendering update after animation frame
  // callbacks, so wait for two frames to let one complete.
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  is(document.activeElement.tagName, "IFRAME", "focus should stay on hidden iframe element");
  ok(await getFocus(iframe.contentWindow), "iframe document should keep focus");
});

add_task(async function test_display_none_object_window_focus() {
  let object = document.createElement("object");
  object.type = "text/html";
  object.data = "https://example.org/tests/dom/base/test/file_focus_display_none_xorigin_iframe_inner.html?announce";
  // object.contentWindow is null for this cross-origin object, so use the
  // source of its message.
  let objectWindow = await new Promise(resolve => {
    window.addEventListener("message", function handler(e) {
      if (e.data === "ready") {
        window.removeEventListener("message", handler);
        resolve(e.source);
      }
    });
    document.getElementById("objectcontainer").append(object);
  });
  document.getElementById("objectcontainer").style.display = "none";
  document.body.offsetWidth;
  input.focus();
  is(document.activeElement.tagName, "INPUT", "focus should move to input element");

  await sendMessage(objectWindow, "focuswindow");
  is(document.activeElement.tagName, "OBJECT", "focus should move to object element");
  ok(await getFocus(objectWindow), "object document should have focus");
});

add_task(async function test_nested_display_none_window_focus() {
  let outer = document.querySelector("#nested iframe");
  input.focus();
  is(document.activeElement.tagName, "INPUT", "focus should move to input element");

  // The inner document gets focus, and each iframe on the way to it becomes
  // the active element of its document.
  await sendMessage(outer.contentWindow, "focuswindow");
  is(document.activeElement, outer, "focus should move to outer iframe element");
  ok(await getFocus(outer.contentWindow), "inner iframe document should have focus");
  let activeInMiddle = await new Promise(resolve => {
    window.addEventListener("message", e => resolve(e.data), { once: true });
    outer.contentWindow.postMessage("getactiveelement", "*");
  });
  is(activeInMiddle, "IFRAME", "inner iframe should be the active element of the middle document");
});

add_task(async function test_ancestor_display_none_init() {
  // focus input element
  input.focus();
  is(document.activeElement.tagName, "INPUT", "focus should move to input element");

  // focus input element in hidden iframe
  await sendMessage(iframe.contentWindow, "focus");
  is(document.activeElement.tagName, "INPUT", "focus should stay on input element");
});

add_task(async function test_remove_ancestor_display_none() {
  // remove `display: none` from the ancestor of iframe
  document.getElementById("target").style = "";
  document.body.offsetWidth;

  // focus input element
  input.focus();
  is(document.activeElement.tagName, "INPUT", "focus should move to input element");

  // focus input element in hidden iframe
  await sendMessage(iframe.contentWindow, "focus");
  is(document.activeElement.tagName, "IFRAME", "focus should move to iframe element");
});

add_task(async function test_ancestor_display_none() {
  // add `display: none` to the ancestor of iframe back
  document.getElementById("target").style = "display: none;";
  document.body.offsetWidth;

  // The focus fixup runs in the rendering update after animation frame
  // callbacks, so wait for two frames to let one complete.
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  is(document.activeElement.tagName, "IFRAME", "focus should stay on hidden iframe element");

  // focus input element
  input.focus();
  is(document.activeElement.tagName, "INPUT", "focus should move to input element");

  // focus input element in hidden iframe
  await sendMessage(iframe.contentWindow, "focus");
  is(document.activeElement.tagName, "INPUT", "focus should stay on input element");
});

add_task(async function test_remove_ancestor_display_none_again() {
  // remove `display: none` from the ancestor of iframe
  document.getElementById("target").style = "";
  document.body.offsetWidth;

  // focus input element
  input.focus();
  is(document.activeElement.tagName, "INPUT", "focus should move to input element");

  // focus input element in hidden iframe
  await sendMessage(iframe.contentWindow, "focus");
  is(document.activeElement.tagName, "IFRAME", "focus should move to iframe element");
});

add_task(async function test_iframe_display_none() {
  // add `display: none` to iframe
  iframe.style = "display: none;";
  document.body.offsetWidth;

  // focus input element
  input.focus();
  is(document.activeElement.tagName, "INPUT", "focus should move to input element");

  // focus input element in hidden iframe
  await sendMessage(iframe.contentWindow, "focus");
  is(document.activeElement.tagName, "INPUT", "focus should stay on input element");
});

add_task(async function test_remove_iframe_display_none() {
  // remove `display: none` from iframe
  iframe.style = "";
  document.body.offsetWidth;

  // focus input element
  input.focus();
  is(document.activeElement.tagName, "INPUT", "focus should move to input element");

  // focus input element in hidden iframe
  await sendMessage(iframe.contentWindow, "focus");
  is(document.activeElement.tagName, "IFRAME", "focus should move to iframe element");
});

add_task(async function test_inert_iframe() {
  // focus input element in iframe
  await sendMessage(iframe.contentWindow, "focus");
  is(document.activeElement.tagName, "IFRAME", "focus should move to iframe element");

  // A rendered iframe that becomes inert isn't focusable anymore, so the focus
  // fixup, which runs after animation frame callbacks, moves focus away.
  document.getElementById("target").inert = true;
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  is(document.activeElement.tagName, "BODY", "focus should move away from inert iframe");
  document.getElementById("target").inert = false;
});

</script>
</body>
</html>
