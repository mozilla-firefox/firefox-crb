<!DOCTYPE html>
<script src="/tests/SimpleTest/SimpleTest.js"></script>
<h2>Inner</h2>
<input></input><br>
<script type="text/javascript">
let input = document.querySelector("input");

window.onmessage = function(e) {
  info(`inner received message: ${e.data}`);
  if (e.data === "focus") {
    input.focus();
    window.parent.postMessage("done", "*");
  } else if (e.data === "focuswindow") {
    window.focus();
    window.parent.postMessage("done", "*");
  } else if (e.data === "getfocus") {
    window.parent.postMessage(document.hasFocus(), "*");
  } else if (e.data === "waitforblur") {
    let reply = () =>
      window.parent.postMessage(
        `${document.activeElement.tagName} ${document.hasFocus()}`, "*");
    if (document.activeElement == input) {
      input.addEventListener("blur", reply, { once: true });
    } else {
      reply();
    }
  }
};
if (location.search == "?announce") {
  window.onload = () => window.parent.postMessage("ready", "*");
}
</script>
