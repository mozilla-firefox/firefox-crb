# https://firefox-source-docs.mozilla.org/toolkit/components/glean/user/new_definitions_file.html

---
$schema: moz://mozilla.org/schemas/glean/metrics/2-0-0
$tags:
  - "Core :: Machine Learning"

page_extractor:
  phase:
    type: event
    description: |
      The Glean twin of a "PageExtractor" profiler marker: recorded for every
      phase of every PageExtractor call (headless-extractor, get-text,
      dom-extract, pdf-extract, and so on; see PageExtractorEvent.Phase in
      PageExtractorEvents.sys.mjs), in whichever process it ran, whether or
      not the profiler is running. Smart Window is one caller among possibly
      several.

      `flow_id` ties every phase of one call together, and is the same value
      as the `flowId` field on that call's profiler markers. Use it to
      cross-reference a shared profile with this data.

      Slice by `phase` for a route's outcome and latency (e.g.
      "headless-extractor" for headless loads, "pdf-extract" for PDFs,
      "captcha-detected", "captcha-script" and "captcha-wait" for bot checks
      in headless loads), by
      `strategy` for how a get-text call read the page ("dom", "reader",
      "youtube-dom", "youtube-transcript", "google-docs", "about-reader"),
      and by `site_strategy` for site-specific handling ("google-search",
      "youtube"). `status` and `error_name` give success rate and failure
      reasons per slice; `duration_ms` gives latency per slice.

      `text_length`, `link_count` and `canvas_count` are rounded down to a
      power of two (0 stays 0) so an exact value can't fingerprint the page.
      `duration_ms` measures our own work and is recorded exactly.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2058247
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2088246
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2088247
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2088250
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2058247
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2088246
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2088247
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2088250
    data_sensitivity:
      - web_activity
    notification_emails:
      - firefox-ai-and-ml@mozilla.com
    send_in_pings:
      - page-extractor
    expires: 169
    extra_keys:
      flow_id:
        type: string
        description: Correlates every phase of one PageExtractor call.
      process:
        type: string
        description: The process this phase ran in, "parent" or "content".
      phase:
        type: string
        description: >
          The PageExtractor phase, e.g. "headless-extractor", "get-text",
          "dom-extract", "pdf-extract". See PageExtractorEvent.Phase in
          PageExtractorEvents.sys.mjs for the full list.
      strategy:
        type: string
        description: >
          The extraction/load strategy used, e.g. "dom", "pdf", "reader",
          "youtube-dom", "youtube-transcript", "google-docs", "about-reader",
          "headless", "headless-anonymous". Omitted when not applicable to this
          phase.
      site_strategy:
        type: string
        description: >
          Site-specific handling applied on top of `strategy`, when any:
          "google-search" or "youtube". Omitted otherwise.
      status:
        type: string
        description: >
          The phase's outcome: "success", "error", or a handled non-error
          outcome such as "unavailable", "document-hidden", "empty",
          "not-readerable", "document-unloaded", "blocked" (the site kept the
          page from being read; see `block_reason`), or "detected" (a captcha
          showed up). "captcha-detected" is only recorded when a captcha
          shows up.
          "captcha-script" is only recorded when the page requests a captcha
          widget's script, with "requested", and `duration_ms` is how long
          into the load that was. "captcha-wait" is recorded when a short
          read waited for that widget, with "appeared" or "gave-up".
      error_name:
        type: string
        description: >
          The thrown error's `name` when status is "error". Omitted
          otherwise.
      block_reason:
        type: string
        description: >
          The reason extraction was blocked: "off-site" means the load ended up
          on another site, and "captcha" means a bot check stood in front of
          the content. Only present when status is "blocked".
      captcha_type:
        type: string
        description: >
          The captcha provider CaptchaDetection reported in the page, e.g.
          "g-recaptcha-v2", "cf-turnstile", "datadome", "hCaptcha",
          "arkoseLabs". Omitted when none was seen.
      captcha_event:
        type: string
        description: >
          The latest captcha state seen in the page by the time the phase
          finished: "shown" (the widget loaded), "challenge" (a puzzle was
          presented), "blocked" (the provider refused the visitor), "failed"
          or "passed". "captcha-detected" finishes when the first captcha is
          found, so there it is the first state, and `duration_ms` is the time
          from the start of the page load until then; see `detected_by`.
          Omitted when no captcha was seen.
      detected_by:
        type: string
        description: >
          On "captcha-detected", how the captcha was found: "frame-report"
          (its frame reported in as it loaded), "frame-url" (its frame's URL
          was spotted when the page was read, so `duration_ms` runs until the
          read rather than until the captcha appeared), or "response-header"
          (the page's response was marked as a Cloudflare challenge). Omitted
          otherwise.
      text_length:
        type: quantity
        description: >
          Text length in UTF-16 code units, rounded down to a power of two.
          Omitted when not applicable to this phase.
      link_count:
        type: quantity
        description: >
          Links extracted, rounded down to a power of two. Omitted when not
          applicable to this phase.
      canvas_count:
        type: quantity
        description: >
          Canvas snapshots captured by this phase, rounded down to a power
          of two. Omitted when not applicable to this phase.
      duration_ms:
        type: quantity
        description: Wall-clock time in milliseconds for this phase.
